[package]
name = "threadbeat"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Durable same-task heartbeat scheduling through an existing Codex app-server"
license = "Apache-2.0"
repository = "https://github.com/NightTrek/threadbeat"
homepage = "https://github.com/NightTrek/threadbeat"
readme = "README.md"
publish = false

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = { version = "=0.10.4", features = ["serde"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
directories = "=6.0.0"
fs2 = "=0.4.3"
futures-util = "=0.3.34"
hex = "=0.4.3"
rmcp = { version = "=3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "chrono", "serde_json", "uuid"] }
schemars = { version = "=1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "=0.30.0"
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.25.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
proptest = "=1.10.0"
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Public API error docs and must-use annotations are maintained as a separate
# documentation pass; enforcing them here obscures behavioral lint findings.
missing_errors_doc = "allow"
must_use_candidate = "allow"
# These are deliberate at subsystem boundaries or in generated async-trait
# code, and refactoring them solely for lint shape would reduce clarity.
needless_pass_by_value = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
# Long state-machine handlers are isolated in daemon.rs and should be split by
# design work, not mechanically to satisfy a line-count threshold.
too_many_lines = "allow"
# Style-only preferences currently conflict with clearer control-flow and the
# protected daemon/store implementation.
assigning_clones = "allow"
collapsible_if = "allow"
if_not_else = "allow"
needless_return = "allow"
